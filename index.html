
<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>د مالک پاسورډ جوړول</title>
<style>
body {
  font-family: sans-serif;
  background: #eef4fa;
  color: #173454;
  padding: 20px;
}
.card {
  background: white;
  max-width: 440px;
  margin: 70px auto;
  padding: 25px;
  border-radius: 20px;
}
input, button {
  box-sizing: border-box;
  width: 100%;
  padding: 16px;
  margin-top: 15px;
  font-size: 16px;
  border-radius: 12px;
}
input { border: 1px solid #ccd6e0; }
button {
  background: #1464bc;
  color: white;
  border: none;
}
button:disabled { opacity: 0.6; }
[hidden] { display: none !important; }
#msg { line-height: 2; overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="card">
  <h2>هلمند موبلین او فلټر</h2>
  <p>د مالک پاسورډ بیا جوړول</p>

  <div id="requestBox">
    <input id="email" type="email"
      placeholder="خپل ایمېل ولیکه">
    <button id="send" type="button">
      د پاسورډ لینک راولېږه
    </button>
  </div>

  <div id="resetBox" hidden>
    <input id="password" type="password"
      placeholder="نوی پاسورډ">
    <input id="confirm" type="password"
      placeholder="پاسورډ بیا ولیکه">
    <button id="change" type="button">
      نوی پاسورډ ثبت کړه
    </button>
  </div>

  <p id="msg" role="status"></p>
</div>

<script>
const BASE = 'https://vsoykppxdohsaneenrae.supabase.co';
const KEY = 'sb_publishable_YFBENIpmCrqI0F-YlCRz2Q_lqYWKJtK';

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.hash.slice(1));

let token = null;

if (params.get('error_description')) {
  $('msg').textContent = params.get('error_description');
}

if (params.get('type') === 'recovery' &&
    params.get('access_token')) {
  token = params.get('access_token');
  $('requestBox').hidden = true;
  $('resetBox').hidden = false;
  $('msg').textContent = 'اوس نوی پاسورډ جوړ کړه.';
  history.replaceState(null, '', location.pathname);
}

$('send').onclick = async function () {
  const email = $('email').value.trim();

  if (!email || !$('email').checkValidity()) {
    $('msg').textContent = 'سم ایمېل ولیکه.';
    return;
  }

  if (!KEY.startsWith('sb_publishable_')) {
    $('msg').textContent = 'Publishable key سم نه دی.';
    return;
  }

  $('send').disabled = true;
  $('msg').textContent = 'د لینک لېږلو غوښتنه کېږي...';

  try {
    const redirect = location.origin + location.pathname;
    const response = await fetch(
      BASE + '/auth/v1/recover?redirect_to=' +
        encodeURIComponent(redirect), {
        method: 'POST',
        headers: {
          'apikey': KEY,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ email })
      }
    );

    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(
        data.msg || data.message ||
        data.error_description || 'HTTP ' + response.status
      );
    }

    $('msg').textContent =
      'غوښتنه ومنل شوه. که ایمېل ثبت وي، Gmail وګوره.';

  } catch (error) {
    $('msg').textContent = 'تېروتنه: ' + error.message;
  } finally {
    $('send').disabled = false;
  }
};

$('change').onclick = async function () {
  const password = $('password').value;
  const confirm = $('confirm').value;

  if (!token) {
    $('msg').textContent = 'د پاسورډ نوی لینک خلاص کړه.';
    return;
  }

  if (password.length < 8 || password !== confirm) {
    $('msg').textContent =
      'دواړه پاسورډونه یو شان او لږ تر لږه ۸ توري وي.';
    return;
  }

  $('change').disabled = true;
  $('msg').textContent = 'پاسورډ ثبتېږي...';

  try {
    const response = await fetch(BASE + '/auth/v1/user', {
      method: 'PUT',
      headers: {
        'apikey': KEY,
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ password })
    });

    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(
        data.msg || data.message || 'HTTP ' + response.status
      );
    }

    token = null;
    $('password').value = '';
    $('confirm').value = '';
    $('resetBox').hidden = true;
    $('msg').textContent =
      'پاسورډ بدل شو! اوس خپل اپ ته ننوزه.';

  } catch (error) {
    $('msg').textContent = 'تېروتنه: ' + error.message;
  } finally {
    $('change').disabled = false;
  }
};
</script>
</body>
</html>
